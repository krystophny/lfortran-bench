id: lf-8100-allocatable-print
title: "lfortran: fix print of allocatable scalar integer"
repo_url: https://github.com/lfortran/lfortran.git
issue_url: https://github.com/lfortran/lfortran/pull/8100
base_commit: 5391d3f3a1e0316bafec93b5c147ad281a4473d8
fixed_commit: 0b561d4dbd7d2b8d762f09e17f8c94a083aeda63
setup_commands:
  - "conda run -n lf-llvm11 bash -c 'cd {workspace} && bash build0.sh && cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_LLVM=yes -DCMAKE_BUILD_TYPE=Debug -DWITH_ZSTD=no -DWITH_ZLIB=no -DWITH_RUNTIME_STACKTRACE=yes && ninja -C build'"
acceptance_commands:
  - "python3 {task_dir}/validate.py {workspace}"
issue_body: |
  Printing an allocatable scalar integer with a format string fails at
  compile time. The compiler does not correctly handle formatted print
  statements for allocatable scalar variables.
acceptance_hint: |
  The validator compiles and runs integration_tests/allocate_24.f90
  using the built lfortran binary. The test assigns, prints with format,
  and deallocates an allocatable scalar integer.
