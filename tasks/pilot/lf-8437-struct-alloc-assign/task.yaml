id: lf-8437-struct-alloc-assign
title: "lfortran: fix allocatable string component in derived type array"
repo_url: https://github.com/lfortran/lfortran.git
issue_url: https://github.com/lfortran/lfortran/pull/8437
base_commit: d8d25738bc265f9c3c807f203815746c2d811257
fixed_commit: 59d9d1cb633757a1afb4f55387f756547bff0f3e
setup_commands:
  - "conda run -n lf-llvm11 bash -c 'cd {workspace} && bash build0.sh && cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_LLVM=yes -DCMAKE_BUILD_TYPE=Debug -DWITH_ZSTD=no -DWITH_ZLIB=no -DWITH_RUNTIME_STACKTRACE=yes && ninja -C build'"
acceptance_commands:
  - "python3 {task_dir}/validate.py {workspace}"
issue_body: |
  Assigning an array of derived types with allocatable character
  components to an allocatable array member fails. The compiler does
  not correctly handle deep copy of allocatable string components
  during derived type array assignment.
acceptance_hint: |
  The validator compiles and runs integration_tests/derived_types_79.f90
  using the built lfortran binary. The test assigns a derived type array
  with allocatable strings to an allocatable component and reads back.
